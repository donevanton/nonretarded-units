<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>nonretarded-units</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 290px; margin: 0; }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      background: var(--brand-bg); color: var(--brand-fg);
    }
    header img { width: 44px; height: 44px; border-radius: 50%; box-shadow: 0 0 0 2px var(--accent); }
    header .name { font-weight: 700; font-size: 15px; }
    header .tag { font-size: 12px; opacity: .75; }
    main { padding: 6px 16px 14px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
    .row + .row { border-top: 1px solid var(--line); }
    .row .label { font-weight: 600; }
    .row .sub { font-size: 12px; color: var(--muted); word-break: break-all; }
    .count { margin: 4px 0 12px; font-size: 12.5px; color: var(--muted); }
    .count b { color: var(--fg); }
    button.link { width: 100%; }
  </style>
</head>
<body>
  <header>
    <img src="../icons/icon128.png" alt="">
    <div>
      <div class="name">nonretarded-units</div>
      <div class="tag">Imperial in, metric out.</div>
    </div>
  </header>
  <main>
    <div class="row">
      <div>
        <div class="label">On this site</div>
        <div class="sub" id="host">—</div>
      </div>
      <label class="switch"><input type="checkbox" id="site"><span></span></label>
    </div>
    <div class="row">
      <div>
        <div class="label">Everywhere</div>
        <div class="sub">Master switch</div>
      </div>
      <label class="switch"><input type="checkbox" id="global"><span></span></label>
    </div>
    <p class="count" id="count"></p>
    <button class="link" id="options">All settings</button>
  </main>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
